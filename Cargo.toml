[workspace]
members = [
    "crates/monada-fixed",
    "crates/monada-nav",
    "crates/monada-sim",
    "crates/monada-runtime",
    "crates/monada-script",
    "crates/monada-net",
    "crates/monada-render",
    "crates/monada-voxvideo",
    "crates/monada-physics",
    "crates/monada-host",
    "crates/monada-web",
    "crates/monada-format",
    "crates/monada-editor",
    "crates/monada-oracle",
    "crates/monada-chess",
    "crates/monada-rpg",
    "crates/monada-rts",
    "crates/monada-ship",
    "crates/monada-desert",
    "crates/monada-desert-rules",
    "crates/monada-digger",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NCrashed/monada"
authors = ["Anton Gushcha <ncrashed@gmail.com>"]
# Native dev + tests run on stable; the nightly pin in
# rust-toolchain.toml exists only for the wasm threads path inherited
# from roxlap (see roxlap's PORTING-WASM.md). No nightly-only feature
# is used off the wasm32 target.
rust-version = "1.77"
readme = "README.md"

[workspace.dependencies]
# Render-side world math, lifted from roxlap's choice so the
# sim->scene bridge (monada-render, M1) speaks the same primitives the
# scene graph expects. NEVER pulled into monada-sim: sim coords are
# Q32.32 (monada-fixed), floats live strictly on the render side of
# the wall (DESIGN.md §3.1).
glam = { version = "0.30", default-features = false, features = ["std", "serde"] }
# Replay snapshots + state serialisation. Format-agnostic; downstream
# picks bincode / postcard / etc.
serde = { version = "1", default-features = false, features = ["derive"] }

# Internal crates, referenced by path during local dev; the `version`
# is what a future `cargo publish` records for downstream resolution
# (mirrors roxlap's convention).
monada-fixed = { path = "crates/monada-fixed", version = "0.0.1" }
monada-nav = { path = "crates/monada-nav", version = "0.0.1" }
monada-sim = { path = "crates/monada-sim", version = "0.0.1" }
monada-desert-rules = { path = "crates/monada-desert-rules", version = "0.0.1" }
monada-runtime = { path = "crates/monada-runtime", version = "0.0.1" }
monada-script = { path = "crates/monada-script", version = "0.0.1" }
monada-net = { path = "crates/monada-net", version = "0.0.1" }
monada-render = { path = "crates/monada-render", version = "0.0.1" }
monada-voxvideo = { path = "crates/monada-voxvideo", version = "0.0.1" }
monada-physics = { path = "crates/monada-physics", version = "0.0.1" }
monada-format = { path = "crates/monada-format", version = "0.0.1" }

# roxlap voxel engine 0.32.0 (crates.io, CI-safe). 0.32.0 is BB.6, the
# billboard up axis, asked for from this repo's ship demo
# (roxlap's docs/handover-billboard-camera-up.md): `BillboardMode` now
# says only which way a card FACES, and the new `BillboardUp` says which
# way is UP inside it — world up (unchanged default), the camera's own
# up, or an app-supplied axis. Actors got the matching frame:
# `ActorFacing::Dir(world_nose)` measures the directional sector in the
# actor's own floor plane instead of the world's horizontal one. Both
# halves matter here because monada's camera can now ride a rotating
# grid (`camera_grid`, host_api 17): a crew member on a tumbling hull
# was leaning on screen AND drifting through its sprite rotations (0.27
# rad at the ship's tilt — a third of a sector). `map_render` hands each
# grid-bound actor `Dir` + `Axis(grid up)` and drops the consumer-side
# `billboard_yaw` correction that stood in for the second half; an
# unbound actor keeps the verbatim `Yaw` + `World` path, which roxlap
# pins as bit-identical. One breaking field — `BillboardActorDef::up` —
# which `actor_def` inherits from `..default()`.
#
# 0.31.1 fixed the fog
# twin freezing its render config on quiet frames: `FowTwin::sync` mirrored
# the real grid's transform / `z_clip` / sky / LOD behind its quiet-frame
# early-out, whose key moves on neither a re-pose nor a cutaway, so the
# twin — the only grid that draws — stalled at its last busy frame. That is
# the ship demo's rotating hull and its deck cutaway, and it retires the
# `MapRender::mirror_twin` workaround that copied the set host-side.
# The 0.30→0.31 bump (CT series) fixes the digger demo's "invisible
# walls": carving a column at a
# chunk-z boundary left an undeletable solid layer both backends rendered
# while collision said air (voxlap's historical bedrock placeholder at
# chunk-local z 255) — columns now empty fully via the empty-column
# sentinel; plus 0.30.1's cutaway fix (coarse-mip `z_clip` plane now
# ceil-rounded, so the cut-away layer can't reappear past the GPU mip scan
# radius). No API changes on monada's surface. Keeps the billboard-actor
# API the RPG demo needs (GIF-imported 8-direction animated cutouts:
# roxlap-formats `gif` → roxlap-render `add_billboard_actor` /
# `update_billboard_actors`, renderer auto-picking the facing sprite from
# camera bearing vs the actor's yaw). The 0.21→0.30 bump (QE series) is
# type-tightening, not behaviour: packed colours became the `VoxColor` /
# `Rgb` / `OverlayColor` newtype family (`0xBB_RR_GG_BB` brightness vs plain
# RGB vs real-alpha overlay — a mix-up is now a compile error, not an
# over-bright voxel); `FrameParams` went `#[non_exhaustive]` (build via
# `FrameParams::new` + field overrides) with the GPU step budget / FOV now
# derived from scan distance + projection and the mip-scan distance moved to
# `RenderOptions`; `RenderOptions.want_gpu: bool` became
# `backend: BackendPreference`; and `add_billboard_actor` returns `Option`.
# Oracle goldens are byte-identical across the bump. Still the unified
# SceneRenderer facade over CPU/GPU.
#
# The sibling checkout rather than crates.io. This used to be the other way
# round, so an in-progress roxlap working copy could not perturb monada's
# build — but the two are developed together and the wall cost more than it
# saved: `host_api` 29 needs `BillboardMode::CylindricalViewPlane` and
# `set_actor_mode`, and pinning the published crate meant monada could not
# compile the feature that had just been written next door. Goes back to a
# version pin when roxlap and monada are released together.
roxlap-core = { path = "../roxlap/crates/roxlap-core" }
roxlap-render = { path = "../roxlap/crates/roxlap-render" }
roxlap-scene = { path = "../roxlap/crates/roxlap-scene" }
roxlap-formats = { path = "../roxlap/crates/roxlap-formats" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Module-name redundancy is fine for small crates that may grow
# (matches roxlap's stance).
module_name_repetitions = "allow"

# Deps (roxlap's software raycaster above all) are unusable at opt-level 0;
# optimize them even in dev builds. Workspace members stay -O0 for fast
# iteration — sim determinism is integer fixed-point, indifferent to opt level.
[profile.dev.package."*"]
opt-level = 2
