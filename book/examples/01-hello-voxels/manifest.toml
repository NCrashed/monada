# The smallest complete monada map (book chapter 3). A one-voxel floor and
# a single box that walks across it — enough to exercise init + tick.
name = "Hello Voxels"
engine_version = "0.0.1"
# Script-API version this map requires; the host refuses a map asking
# for an API it does not carry (chapter 3 explains the contract). This
# map only calls the oldest verbs, but hosts support v11 and up — v11
# was a breaking change, so it took the supported floor with it.
host_api = 11
players = 1
# Real-time: the sim advances on a fixed 30 Hz clock, so `tick(dt)` runs.
sim_hz = "30hz"
script_runtime = "rhai"
entry = "scripts/main.rhai"
