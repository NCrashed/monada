name: Book

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# The example maps under book/examples/ are exercised by the workspace test
# suite (monada-oracle's `book_examples_run_headless`), so this workflow only
# builds and publishes the prose. mdbook fails on a missing {{#include}}
# target, so a renamed example anchor breaks the build here.
permissions:
  contents: read

concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: mdbook build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mdbook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - run: mdbook build book
      - name: Upload site artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: book/book

  deploy:
    name: deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
