[package]
name = "monada-desert-rules"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "The desert game's rules: a volumetric Dune II-class RTS as compiled Rust against monada's host API."
publish = false

[dependencies]
# The host surface the rules call. Deliberately the ONLY engine edge —
# no renderer, no host loop, no scripting runtime — so the whole game is
# testable headless and compiles to wasm later (plan §3f).
monada-runtime = { workspace = true }
monada-sim = { workspace = true }
monada-fixed = { workspace = true }
# The rules own hashed state of their own (plan §3c), so they own its
# canonical bytes too: `MapRules::snapshot` is what the driver hashes and
# what a saved game restores from.
serde = { workspace = true }
postcard = { version = "1", features = ["use-std"] }

[lints]
workspace = true
