# A Warcraft-III-class RTS demo map — the frame for monada's deterministic
# navigation + selection seams (docs/plans/rts-demo.md). Manifest schema:
# monada_format::Manifest.
name = "monada RTS demo"
engine_version = "0.0.1"
# Script-API version required (monada-script HOST_API_VERSION). 2 =
# `camera_pan` (the free RTS scroll), 3 = `nav_path`/`nav_block` (the
# deterministic pathfinder), 5 = multi-select (`highlight_add`/
# `highlighted_all`/`drag_begin`/`drag_end`), 6 = `voxel_clear` (tree
# felling / razed buildings); a host outside its supported range refuses
# the map instead of desyncing.
host_api = 6
# 1v1: two players over LAN lockstep (--listen host = player 0, --connect
# client = player 1). Runs solo too (no flag = hotseat, driving player 0).
players = 2
# Real-time: the sim advances on a fixed 30 Hz clock. Unlike the RPG there is
# no per-tick input snapshot — orders are event-driven `submit_command`s from
# the local layer's `action` handler (click gestures), any number per tick.
sim_hz = "30hz"
script_runtime = "rhai"
entry = "scripts/main.rhai"

# Rebindable input actions (docs/plans/input-bindings.md). The local layer
# reads `select`/`order` as click edges (`action(id, down)`) and `pan` as a
# held axis in `local_tick`.
[[action]]
id = "select"
kind = "button"
default = ["MouseLeft"]
label = { en = "Select" }

[[action]]
id = "order"
kind = "button"
default = ["MouseRight"]
label = { en = "Order" }

[[action]]
id = "pan"
kind = "axis2"
default = { up = "KeyW", down = "KeyS", left = "KeyA", right = "KeyD" }
label = { en = "Pan camera" }

[[action]]
id = "train1"
kind = "button"
default = ["KeyQ"]
label = { en = "Train worker" }

[[action]]
id = "train2"
kind = "button"
default = ["KeyE"]
label = { en = "Train soldier" }
