[package]
name = "monada-physics"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme.workspace = true
description = "Voxel-native rigid-body solver: voxel-vs-voxel collision, edit-API destruction."

[dependencies]
monada-fixed = { workspace = true, features = ["serde"] }
# `StateHash`/`StateHasher` — physics folds into the same FNV-1a desync
# digest the rest of the sim uses (docs/plans/voxel-physics.md §5).
monada-sim = { workspace = true }
serde = { workspace = true, features = ["std"] }

[dev-dependencies]
# Snapshot round-trip test only; a human-readable format keeps replay
# debugging legible. Not a runtime dependency (mirrors monada-sim).
serde_json = "1"
# The P5 scale benchmark (32 vehicles + 256 wrecks vs the 4 ms budget).
# Pre-approved dev-dep (docs/plans/voxel-physics.md §1 rule 8).
criterion = "0.5"

[[bench]]
name = "scale"
harness = false

[lints]
workspace = true
