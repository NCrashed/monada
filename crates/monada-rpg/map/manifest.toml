# A co-op action-RPG demo map — a proof that the map-agnostic monada core can
# carry a real-time, billboard-sprite game. Manifest schema:
# monada_format::Manifest.
name = "monada RPG demo"
engine_version = "0.0.1"
# Script-API version required (monada-script HOST_API_VERSION); a host
# outside its supported range refuses the map instead of desyncing. The
# map only calls the v1 surface, but v11 broke the grid semantics and
# carried the supported floor with it, so 11 is the oldest a host runs.
host_api = 11
# Co-op: two players over LAN lockstep (--listen host = player 0, --connect
# client = player 1). No PvP — both fight the waves together, sharing one
# deterministic sim. Runs solo too (no flag = hotseat player 0).
players = 2
# Real-time: the sim advances on a fixed 30 Hz clock; the map's local layer
# (`local_tick` in the entry script) assembles one per-tick input command
# per local player from the declared actions below.
sim_hz = "30hz"
script_runtime = "rhai"
entry = "scripts/main.rhai"

# Rebindable input actions (docs/plans/input-bindings.md). The local layer
# polls these in `local_tick`; a user overrides the keys in the host's
# bindings.toml under [map."monada RPG demo"].
[[action]]
id = "move"
kind = "axis2"
default = { up = "KeyW", down = "KeyS", left = "KeyA", right = "KeyD" }
label = { en = "Move" }

[[action]]
id = "attack"
kind = "button"
default = ["MouseLeft"]
label = { en = "Attack" }

[[action]]
id = "dodge"
kind = "button"
default = ["Space"]
label = { en = "Dodge" }
