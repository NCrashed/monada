[package]
name = "monada-ship"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "A spaceship crew-sim demo map (scripts + GIF actors) exercising monada's third-person view + per-crew visibility seams, with a thin `cargo run` launcher. S-A: the walk-around skeleton."
publish = false

[[bin]]
name = "monada-ship"
path = "src/main.rs"

[dependencies]
# The host event loop + shared map CLI + archive loader. Like monada-rpg,
# this crate just loads the bundled `ship.monada` and hands it to the host.
# `default-features = false` + re-adding `audio` via this crate's own feature
# lets a headless build (`--no-default-features`) drop cpal/ALSA.
monada-host = { path = "../monada-host", default-features = false }
monada-format = { workspace = true }

[features]
default = ["audio"]
# Forwards to the host's real sound playback (on by default).
audio = ["monada-host/audio"]

[build-dependencies]
# build.rs packs `map/` into a deterministic `ship.monada` in OUT_DIR.
monada-format = { workspace = true }

[dev-dependencies]
# Headless smoke / determinism tests drive the Rhai backend directly (no host,
# no window) under a TerrainBridge, mirroring monada-rpg.
monada-format = { workspace = true }
monada-script = { workspace = true }
monada-sim = { workspace = true }
monada-fixed = { workspace = true }

[lints]
workspace = true
