[package]
name = "monada-ship"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "A spaceship crew-sim demo map (scripts + GIF actors) exercising monada's third-person view + per-crew visibility seams, with a thin `cargo run` launcher. S-A: the walk-around skeleton."
publish = false

[[bin]]
name = "monada-ship"
path = "src/main.rs"

[dependencies]
# The host event loop + shared map CLI + archive loader. Like monada-rpg,
# this crate just loads the bundled `ship.monada` and hands it to the host.
# `default-features = false` + re-adding `audio` via this crate's own feature
# lets a headless build (`--no-default-features`) drop cpal/ALSA.
monada-host = { path = "../monada-host", default-features = false }
monada-format = { workspace = true }

[features]
default = ["audio"]
# Forwards to the host's real sound playback (on by default).
audio = ["monada-host/audio"]

[build-dependencies]
# build.rs packs `map/` into a deterministic `ship.monada` in OUT_DIR.
monada-format = { workspace = true }

[dev-dependencies]
# Headless smoke / determinism tests drive the Rhai DRIVER (no host, no window)
# under a NullBridge. The driver rather than the bare backend because the hull
# is a rigid body: its pose comes out of the physics step and the grid-frame
# sync that follows it, both of which live in the driver's tick order
# (docs/plans/ship-physics.md).
monada-format = { workspace = true }
monada-script = { workspace = true }
# For the `SimDriver` trait the driver is stepped through.
monada-net = { workspace = true }
monada-sim = { workspace = true }
monada-fixed = { workspace = true }
# The canary that checks the hull weighs its shell reads the body directly.
monada-physics = { workspace = true }
# `examples/gen_sky.rs` writes the committed starfield panorama PNG.
image = { version = "0.25", default-features = false, features = ["png"] }

[lints]
workspace = true
