# A spaceship crew-sim demo map — the frame for monada's third-person view +
# per-crew visibility seams (docs/plans/ship-visibility.md). Manifest schema:
# monada_format::Manifest.
name = "monada ship demo"
engine_version = "0.0.1"
# Script-API version required (monada-script HOST_API_VERSION); a host
# outside its supported range refuses the map instead of desyncing.
host_api = 26
# Co-op: crew members over LAN lockstep (--listen host = player 0, --connect
# client = player 1). Runs solo too (no flag = hotseat player 0).
players = 2
# Real-time: the sim advances on a fixed 30 Hz clock; the map's local layer
# (`local_tick`) assembles one per-tick input command per local player from
# the declared actions below.
sim_hz = "30hz"
# The physics gate, not a digging one (docs/plans/ship-physics.md, D1): a
# `terrain = "volume"` map gets a `PhysicsWorld` embedded beside its entity
# world, stepped after each tick and folded into the same digest — which is
# what the ship needs to become a rigid body it can bolt engines onto. The
# ship paints NO world terrain (every voxel it has lives in its own hull
# grid), so the isotropic world grid this declares stays empty. One dividend
# beyond physics: the world frame's z now scales like the cubic hull's, so an
# entity released into space off an upper deck is drawn at the height it was
# let go from rather than 16× lower.
terrain = "volume"
script_runtime = "rhai"
entry = "scripts/main.rhai"

# Rebindable input actions (docs/plans/input-bindings.md). Movement, the cargo
# verbs (pick up / set down where the cursor points, and turn what you hold),
# the airlock, and the flight controls.
[[action]]
id = "move"
kind = "axis2"
default = { up = "KeyW", down = "KeyS", left = "KeyA", right = "KeyD" }
label = { en = "Move" }

# Cargo handling is CURSOR-DIRECTED (docs/plans/ship-building.md): the verb
# acts on the deck cell under the pointer — pick up what is there, or set
# down what you are holding — so the mouse button and the key are two
# bindings of one action rather than two features.
[[action]]
id = "use"
kind = "button"
default = ["KeyF", "MouseLeft"]
label = { en = "Pick up / set down" }

[[action]]
id = "rotate"
kind = "button"
default = ["KeyR"]
label = { en = "Turn what you are holding" }

[[action]]
id = "door"
kind = "button"
default = ["KeyG"]
label = { en = "Airlock" }

# Flight controls. The ship is a rigid body with engines on it
# (docs/plans/ship-physics.md): `burn` fires the main drive, `turn` spins the
# reaction wheel. Held, not tapped — an engine burns while the key is down.
[[action]]
id = "burn"
kind = "button"
default = ["Space"]
label = { en = "Main drive" }

[[action]]
id = "turn"
kind = "axis"
default = { pos = "KeyQ", neg = "KeyE" }
label = { en = "Turn ship" }

# Debug aids for `entity_set_side` (docs on the verb: it snaps a model to one
# of the 6 grid faces + a quarter-turn roll, rather than a continuous yaw):
# while carrying a crate, spin/roll it in place so the change is visible on
# sight instead of only provable by test.
[[action]]
id = "rotate_x"
kind = "button"
default = ["Digit1"]
label = { en = "Rotate carried crate (debug)" }

[[action]]
id = "roll_cw"
kind = "button"
default = ["Digit2"]
label = { en = "Roll carried crate CW (debug)" }
