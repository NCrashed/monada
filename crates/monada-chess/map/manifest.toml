# Chess 2.0 — monada's first demo map (DESIGN.md §6). Manifest schema:
# monada_format::Manifest.
name = "Chess 2.0"
engine_version = "0.0.1"
# Script-API version required (monada-script HOST_API_VERSION). 7 =
# `grid_spawn`/`voxel_fill_in` (dynamic grids); a host outside its
# supported range refuses the map instead of desyncing.
host_api = 7
players = 2
# Turn-based: the sim advances only when a command arrives (DESIGN.md §6).
sim_hz = "on_command"
script_runtime = "rhai"
entry = "scripts/main.rhai"
